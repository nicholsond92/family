<!DOCTYPE html>
<html lang="en" data-theme="{{ theme or 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ household }}{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="{{ '#101013' if theme == 'dark' else '#fafafa' }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hub.css">
</head>
<body>
{% if parent %}
<nav class="topnav">
  <div class="brand">{{ household }}</div>
  <div class="navlinks">
    <a href="/">Calendar</a>
    <a href="/swaps">Swaps</a>
    <a href="/messages">Messages</a>
    <a href="/feeds">Feeds &amp; Display</a>
    <a href="/settings">Settings</a>
  </div>
  <form method="post" action="/logout" class="navuser">
    <span class="dot" style="background: {{ parent['color'] }}"></span>
    <span>{{ parent['name'] }}</span>
    <button class="linklike" type="submit">Log out</button>
  </form>
</nav>
{% endif %}
<main class="container">
{% block content %}{% endblock %}
</main>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
