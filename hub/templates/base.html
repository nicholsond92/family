<!DOCTYPE html>
<html lang="en" data-theme="{{ theme or 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ household }}{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="{{ '#101013' if theme == 'dark' else '#fafafa' }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hub.css">
</head>
<body>
{% if parent %}
<nav class="topnav">
  <div class="brand">{{ household }}</div>
  <div class="navlinks">
    <a href="/display">Board</a>
    <a href="/calendar">Calendar</a>
    <a href="/swaps">Swaps</a>
    <a href="/messages">Messages</a>
    <a href="/feeds">Feeds &amp; Display</a>
    <a href="/settings">Settings</a>
  </div>
  <form method="post" action="/logout" class="navuser">
    <span class="dot" style="background: {{ parent['color'] }}"></span>
    <span>{{ parent['name'] }}</span>
    <button class="linklike" type="submit">Log out</button>
  </form>
</nav>
{% endif %}
<main class="container">
{% block content %}{% endblock %}
</main>
{% if parent %}
<!-- Phones get the same bottom tabs as the board, so Manage is never a
     dead end — every page can hop straight back into the app. -->
<nav class="mobiletabs">
  <a href="/display?view=calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/>
      <circle cx="12" cy="15" r="2.2" fill="currentColor" stroke="none"/>
    </svg>
    <span>Calendar</span>
  </a>
  <a href="/display?view=tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 5.5l1.2 1.2L7 4.4M3.5 11.5l1.2 1.2L7 10.4M3.5 17.5l1.2 1.2L7 16.4"/>
    </svg>
    <span>Kids</span>
  </a>
  <a href="/display?view=custody">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>
    </svg>
    <span>Custody</span>
  </a>
  <a href="/settings" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01A1.7 1.7 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
    </svg>
    <span>Manage</span>
  </a>
</nav>
{% endif %}
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
